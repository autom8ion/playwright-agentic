name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint-and-typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run check:version
            - run: npm run check:skills-drift
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        needs: lint-and-typecheck
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            # Creates a fresh throwaway demoqa account for this run and writes it to env/.env.
            # For a real target app, replace this with a checkout of pre-provisioned CI secrets instead.
            - run: npm run setup:user
            - run: npm run test:smoke
            - run: npm run test:api
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
